; DSHudToggle 1.1.0 - HUD hotkey for Death Stranding Director's Cut (Steam, ds.exe dsq 179)
; Loaded by Ultimate ASI Loader (winhttp.dll). Put DSHudToggle.asi and this file next to ds.exe.
; Changes take effect at the next game start. Log: DSHudToggle.log next to the .asi.

[Settings]
; draw = skip drawing the HUD; it keeps updating in the background (default)
; gate = the engine's own "HUD off" path; also pauses HUD logic while hidden
Mode = draw

; Keyboard key: DELETE, F1-F24, INSERT, HOME, PAGEUP, PAUSE, NUMPAD0-9, A-Z, 0-9, MOUSE4, MOUSE5,
; or a virtual-key code like 0x2E. Modifiers: CTRL+, ALT+, SHIFT+ (e.g. CTRL+H).
; Avoid keys that another tool already uses (overlay or upscaler menus often take INSERT, END, PAGEUP, PAGEDOWN).
Key = DELETE

; Controller combo: all buttons held together. NONE = off.
; Works with Xbox-style (XInput) controllers and with DualSense / DualSense Edge / DualShock 4
; (read directly, USB or Bluetooth; picked up about 10 s after the game starts).
; Names: CROSS CIRCLE SQUARE TRIANGLE L1 R1 L2 R2 L3 R3 CREATE OPTIONS PS TOUCHPAD MUTE
;        DPAD_UP DPAD_DOWN DPAD_LEFT DPAD_RIGHT (Xbox names work too: A B X Y LB RB LT RT BACK START)
; MUTE = the DualSense mic button (DualSense / Edge only; Xbox pads would need e.g. L3+R3).
Controller = NONE

; 1 = hide the HUD as soon as the game starts
StartHidden = 0

; 1 = write DSHudToggle.log
Log = 0
